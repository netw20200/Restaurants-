<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#f7f3ed">

    <link rel="icon" type="image/x-icon" href="images/favicon.ico">

    <title>Maison — Modern Restaurant</title>
    <meta
        name="description"
        content="A modern restaurant offering seasonal cuisine, fine ingredients and an unforgettable dining experience."
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- AOS -->
    <link
        href="https://unpkg.com/aos@2.3.4/dist/aos.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="container header-inner">

        <a href="#home" class="logo">
            MAISON
        </a>

        <nav class="nav">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#menu">Menu</a>
            <a href="#chef">Chef</a>
            <a href="#gallery">Gallery</a>
            <a href="#contact">Contact</a>
        </nav>

        <a href="#reservation" class="header-btn">
            Reserve a Table
        </a>

        <button class="menu-toggle" aria-label="Open menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>

</header>


<main>

    <!-- =========================
         HERO
    ========================= -->

    <section class="hero" id="home">

        <div class="hero-image"></div>

        <div class="hero-overlay"></div>

        <div class="container hero-content">

            <div class="hero-text">

                <span
                    class="hero-label"
                    data-aos="fade-up"
                    data-aos-duration="900">
                    MODERN DINING EXPERIENCE
                </span>

                <h1
                    data-aos="fade-up"
                    data-aos-duration="1000"
                    data-aos-delay="150">
                    TASTE THE<br>
                    <span>EXCEPTIONAL.</span>
                </h1>

                <p
                    data-aos="fade-up"
                    data-aos-duration="1000"
                    data-aos-delay="300">
                    Seasonal ingredients, refined flavors and
                    unforgettable moments around the table.
                </p>

                <div
                    class="hero-buttons"
                    data-aos="fade-up"
                    data-aos-duration="1000"
                    data-aos-delay="450">

                    <a href="#reservation" class="btn btn-primary">
                        Reserve a Table
                    </a>

                    <a href="#menu" class="btn btn-outline">
                        Explore Menu
                    </a>

                </div>

            </div>

        </div>

        <div
            class="hero-bottom"
            data-aos="fade-up"
            data-aos-duration="1000"
            data-aos-delay="600">

            <span>EST. 2026</span>

            <span class="hero-line"></span>

            <span>SEASONAL CUISINE</span>

        </div>

    </section>


    <!-- Следующие секции будем добавлять сюда -->

</main>


<!-- AOS -->
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

<script src="script.js"></script>

</body>
  </html>
